# Example site configuration.
#
# Copy to config/site.yaml and fill in with your own deployment's values.
# config/site.yaml is gitignored on purpose: panel and appliance mappings
# describe a specific building's loads, and host addresses describe a specific
# private network. Neither belongs in a repository.
#
# Every value below is a placeholder. Run scripts/verify_site.py after editing
# to confirm each one against your live deployment before trusting it.

verified_at: "unverified"
verified_by: "scripts/verify_site.py"

anylog:
  host_env: ANYLOG_HOST
  default_host: "127.0.0.1"
  rest_port: 32149                 # operator REST
  master_rest_port: 32049
  dbms: customers
  user_agent: "AnyLog/1.23"
  # Query rules confirmed against a live AnyLog 2.x deployment. See
  # docs/ANYLOG_NOTES.md for why each of these is necessary.
  #   - no destination header; local SQL on the operator node
  #   - query partition tables directly, never the parent table
  #   - raw socket, not requests or curl
  #   - no WHERE on parenthesized channel names, filter client side
  tables:
    power: energy_readings
    appliance: nilm_disaggregated
    solar: solar_data
    anomaly: anomalies

channels:
  panels:
    - "Panel1 (Climate)"
    - "Panel2 (Water)"
    - "Panel3 (General)"
  aggregate:
    - "Grid Power"
    - "Generator Power"
  electrical:
    - VrmsA
    - VrmsB
    - F1
  sample_period_s: 1

model_contract:
  # Read these from your own model artifacts, not from documentation. A stale
  # doc claiming a different feature count is the single most common way to
  # feed a served model inputs it was never trained on.
  features: 14
  window: 100
  stride: 10
  mid: 50
  inference_period_s: 30

panels:
  panel1:
    channel: "Panel1 (Climate)"
    label: "Climate"
    appliances: [air_handler, circulation_pump, aux_heater]
    measured_heads: [air_handler]
    focus: "Climate control duty cycle, compressor behavior, auxiliary heat engagement"
  panel2:
    channel: "Panel2 (Water)"
    label: "Water"
    appliances: [water_heater, irrigation, exhaust_fan]
    measured_heads: [water_heater]
    focus: "Water heating and irrigation"
  panel3:
    channel: "Panel3 (General)"
    label: "General"
    appliances:
      - dryer
      - washer
      - dishwasher
      - cooktop
      - refrigerator
      - well_pump
      - workstation
    measured_heads: []
    focus: "Laundry, kitchen, refrigeration, and pumped water"

evidence_quality:
  # List only the heads backed by a dedicated measurement channel. Everything
  # else is an estimate. If a head's label was generated by the same rules the
  # model is scored against, rule agreement is not independent confirmation.
  measured: [air_handler, water_heater]
  inferred_default: true
  max_carry_forward_s: 120
  stale_after_s: 300

home_assistant:
  # Usually on the building's own LAN and unreachable from anywhere else. An
  # evidence provider that needs it has to run on a host inside that network.
  url_env: HA_URL
  default_url: ""
  reachable_from: []
  optional: true
